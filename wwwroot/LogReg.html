<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Login & Register</title>
  <link rel="stylesheet" href="./css/LogReg.css">
  <link rel="icon" href="https://raw.githubusercontent.com/NMinMin/Image/refs/heads/main/z6593266591621_7e630df8aecd9967d6d82f116a73cbd1.jpg" type="image/png">
  
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
  <div class="container" id="container">
    <!-- Form Đăng ký -->
    <div class="form-container sign-up-container">
      <form id="registerForm">
        <h1>Đăng Ký</h1>
        <input type="text" placeholder="Tên đăng nhập" id="regUsername" required />
        <input type="password" placeholder="Mật khẩu" id="regPassword" required minlength="6" />
        <input type="text" placeholder="Họ và tên" id="regFullName" required />
        <input type="email" placeholder="Email" id="regEmail" required />
        <input type="date" placeholder="Ngày sinh" id="regDateOfBirth" required />
        <input type="tel" placeholder="Số điện thoại" id="regPhone" required />
        <input type="text" placeholder="Số nhà, đường" id="regAddressLine" required />
        <div class="address-group">
          <input type="text" placeholder="Tỉnh / Thành phố" id="regProvince" required />
          <input type="text" placeholder="Quận / Huyện" id="regDistrict" required />
          <input type="text" placeholder="Phường / Xã" id="regWard" required />
        </div>
        <button type="submit">Đăng ký</button>
      </form>
    </div>

    <!-- Form Đăng nhập -->
    <div class="form-container sign-in-container">
      <form id="loginForm">
        <h1>Đăng Nhập</h1>
        <input type="text" placeholder="Tên đăng nhập" id="loginUsername" required />
        <input type="password" placeholder="Mật khẩu" id="loginPassword" required />
        <button type="submit">Đăng nhập</button>

        <!-- Nút Google mới thêm -->
        <div class="google-divider">
          <span>hoặc</span>
        </div>
        <div id="googleSignInDiv" class="google-btn-container"></div>
      </form>
    </div>

    <!-- Overlay -->
    <div class="overlay-container">
      <div class="overlay">
        <div class="overlay-panel overlay-left">
          <h1>Chào mừng bạn trở lại!</h1>
          <p>Đã có tài khoản?</p>
          <button class="ghost" id="signIn">Đăng nhập</button>
        </div>
        <div class="overlay-panel overlay-right">
          <h1>Chào mừng đến với cửa hàng!</h1>
          <p>Bạn không có tài khoản?</p>
          <button class="ghost" id="signUp">Đăng ký ngay</button>
        </div>
      </div>
    </div>
  </div>

  <script src="./js/LogReg.js"></script>
</body>
</html>
